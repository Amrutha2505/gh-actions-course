name: 10 - Controlling Execution Flow
on:
    workflow_dispatch:
        inputs:
            run_tests:
                default: true
                description: Whether to run workflows
                type: boolean
jobs:
    lint-build:
        runs-on: ubuntu-latest
        steps:
            -  name: Lint and Build
               run: echo "Lint and Build"
    unit-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Run Unit Tests
              run: echo "Running Unit Tests"
            - name: Failing tests
              if: ${{ github.event.inputs.run_tests }}
              run: exit 1
    deploy-nonprod:
        runs-on: ubuntu-latest
        needs: 
                - lint-build
                - unit-tests
        steps:
            - name: Deploy to Non-Prod
              run: echo "Deploying to Non-Prod"
    e2e-tests:
        runs-on: ubuntu-latest
        needs: 
                - deploy-nonprod
        steps:
            - name: Run E2E Tests
              run: echo "Running E2E Tests"
    load-tests:
        runs-on: ubuntu-latest
        needs: 
                - deploy-nonprod
        steps:
            - name: Run Load Tests
              run: echo "Running Load Tests"
    deploy-prod:
        runs-on: ubuntu-latest
        needs: 
                - e2e-tests
                - load-tests
        steps:
            - name: Deploy to Prod
              run: echo "Deploying to Prod"
