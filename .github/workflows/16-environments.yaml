name: 16 - Working with Environments

on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      MY_ENV_VALUE: ${{ vars.My_ENV_VALUE || 'default-value' }}  
    steps:
      - name: Echo vars
        run: |
          echo "Deploying to staging"
  e2e-tests:
    runs-on: ubuntu-latest
    environment: staging
    needs: deploy-staging
    steps:
      - name: Echo vars
        run: |
          echo "Running e2e tests"
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    needs: e2e-tests
    env:
      MY_ENV_VALUE: ${{ vars.My_ENV_VALUE || 'default-value' }}  
    steps:
      - name: Echo vars
        run: |
          echo "Deploying to production"
