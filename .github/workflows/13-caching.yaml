name: 13 - Caching
on: 
    workflow_dispatch:
        inputs:
            use-cache:
                description: Whether to use cache or not
                type: boolean
                default: true
            node-version:
                type: choice
                description: Node.js version to use
                options:
                    - 18.x
                    - 20.x
                    - 24.x
                default: 24.x
jobs:
    install-deps:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 13-caching/react-app
        outputs:
            cache-key: ${{ steps.cache-key.outputs.cache-key }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Setup node
              uses: actions/setup-node@v3
              with:
                node-version: ${{ inputs.node-version }}
            - name: Calculate Cache key
              id: cache-key
              run: |
                    echo "cache-key=deps-node-modules-${{ hashFiles('13-caching/react-app/package-lock.json') }}" >> $GITHUB_OUTPUT
            - name: Cache node modules
              uses: actions/cache@v3
              if: ${{ inputs.use-cache }}
              id: cache
              with: 
                path: 13-caching/react-app/node_modules
                key: ${{ steps.cache-key.outputs.cache-key }}
            - name: Install dependencies
              if: ${{ steps.cache.outputs.cache-hit != 'true'}}
              run: npm ci
    lint-check:
        runs-on: ubuntu-latest
        needs: install-deps
        defaults:
            run:
                working-directory: 13-caching/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Setup node
              uses: actions/setup-node@v3
              with:
                node-version: ${{ inputs.node-version }}
            - name: Cache node modules
              uses: actions/cache@v3
              if: ${{ inputs.use-cache }}
              id: cache
              with: 
                path: 13-caching/react-app/node_modules
                key: ${{ needs.install-deps.outputs.cache-key }}
            - name: check lint
              run: echo "Checking lint..."
    build:
        needs: install-deps
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 13-caching/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Setup node
              uses: actions/setup-node@v3
              with:
                node-version: ${{ inputs.node-version }}
            - name: Cache node modules
              uses: actions/cache@v3
              if: ${{ inputs.use-cache }}
              id: cache
              with: 
                path: 13-caching/react-app/node_modules
                key: ${{ needs.install-deps.outputs.cache-key }}
            - name: Build project
              run: npm run build