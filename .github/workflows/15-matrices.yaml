name: 15 - Working with  Matrices

on:
  workflow_dispatch:

jobs: 
  backwards-compatibility:
    name: ${{ matrix.os }} - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [18.x, 20.x, 21.x]
        os:
          - ubuntu-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            node-version: 16.x
          - os: ubuntu-latest
            node-version: 21.x
            tag: experimental
    steps:
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{matrix.node-version }}
      - name: Fail if experimental
        if: ${{ matrix.tag == 'experimental' }}
        run: |
          echo "This is an experimental build. Failing the job."
      - name: Perform some tests
        run: |
          echo "Running tests on Node.js version ${{ matrix.node-version }} on ${{ matrix.os }}"
      - name: Uploading test results
        run: echo "Uploading test results"
  include-example:
    name: ${{ matrix.color }} -${{ matrix.size }}- ${{ matrix.shape }}- ${{ matrix.opacity }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        color: [red, green]
        size: [small, large]
        shape: [circle, square]
        include:
          - opacity: 50
          - color: red
            shape: triangle
            opacity: 75
    steps:
      - name: Show matrix values
        run: |
          echo "${{ matrix.color }} -${{ matrix.size }}- ${{ matrix.shape }}- ${{ matrix.opacity }}"
