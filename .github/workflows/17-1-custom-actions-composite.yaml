name: 17 - 1 - Custom Actions - Composite
run-name: '17 - 1 - Custom Actions - Composite | env: ${{ inputs.target-env }}'

on:
    workflow_dispatch:
        inputs:
          target-env:
            description: '"dev" or "prod". Controls the dev dependencies installation'
            required: false
            default: 'dev'

env:
    working-directory: 17-custom-actions/react-app

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ env.working-directory }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: Cache Node and NPM dependencies
              uses: ./.github/actions/composite-deps-cache
              with:
                node-version: 20.x
                working-directory: ${{ env.working-directory }}
                target-env: ${{ inputs.target-env }}
            - name: Test
              run: npm run test
              working-directory: ${{ env.working-directory }}
            - name: Build
              run: npm run build
              working-directory: ${{ env.working-directory }}