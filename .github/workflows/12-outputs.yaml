name: 12 -  Using Outputs
on: 
    workflow_dispatch:
        inputs:
            build_status:
                description: build status from the build job
                type: choice
                options:
                    - success
                    - failure
                default: success
jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            build_status: ${{ steps.build.outputs.build_status }}
            output_status: ${{ steps.build.outputs.output_status }}
            output_status1: ${{ steps.build.outputs.output_status1 }}
        steps:
            - name: "Print GITHUB_OUTPUT Path"
              run: |
                  echo "GITHUB_OUTPUT path: $GITHUB_OUTPUT"
            - name: "Building"
              id: build
              run: |
                  echo "build_status=${{inputs.build_status}}" >> "$GITHUB_OUTPUT"
                  echo "output_status=${{inputs.build_status}}" >> "$GITHUB_OUTPUT"
                  echo "output_status1=failure" >> "$GITHUB_OUTPUT"
                  cat "$GITHUB_OUTPUT"
                  - name: "Building"
            - name: "Print GITHUB_OUTPUT Path"
              run: |
                  echo "mistake=true" > "$GITHUB_OUTPUT"
                  cat "$GITHUB_OUTPUT"
    deploy:
        runs-on: ubuntu-latest
        needs: build
        if: ${{needs.build.outputs.build_status == 'success'}}
        steps:
            - name: "Deploying"
              run: echo "Deploying the project..."
            - name: "Print output status from build job"
              run: |
                  echo "Output status from build job: ${{ needs.build.outputs.output_status }}"
                  echo "Output status1 from build job: ${{ needs.build.outputs.output_status1 }}"


