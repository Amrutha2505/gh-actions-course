name: Cache Node and NPM Dependencies
description: This action allows to cache both Node and NPM dependencies based on the package-lock.json file.

inputs:
  node-version:
    description: 'NodeJS version to use'
    required: true
    default: 18.x
  working-directory:
    description: 'Working directory for the action'
    required: false
    default: '.'
  target-env:
    description: '"dev" or "prod". Controls the dev dependencies installation'
    required: false
    default: 'dev'

runs:
  using: composite
  steps:
    - name: Setup NodeJS version ${{ inputs.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}
    - name: Cache Node and NPM dependencies
      id: cache
      uses: actions/cache@v3
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: node-modules-${{ inputs.target-env }}-${{ hashFiles(format('{0}/{1}', inputs.working-directory, 'package-lock.json')) }}
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        if [[ "${{ inputs.target-env }}" == "dev" ]]; then
          npm ci
        else
          npm ci --omit-dev
        fi
      shell: bash
      working-directory: ${{ inputs.working-directory }}
        
          