name: 13 - Caching
on: 
    workflow_dispatch:
        inputs:
            use-cache:
                description: whether to use cache or not
                type: boolean
                default: true
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 13-caching/react-app
            
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Setup node
              uses: actions/setup-node@v3
            - name: Cache node modules
              uses: actions/cache@v3
              with:
                node-version: '20.x'
            - name: Install dependencies
              run: npm install
            - name: Build project
              run: npm run build
            - name: Run tests
              run: npm test
            - name: Deploying to nonprod
              run: echo "Deploying to nonprod environment..."