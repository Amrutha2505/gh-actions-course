name: 15 - Working with  Matrices

on:
  workflow_dispatch:

jobs: 
  backwards-compatibility:
    name: ${{ matrix.os }} - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 21.x]
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{matrix.node-version }}

